name: Docs Builder Tests

on:
    push:
        branches:
            - main
    pull_request:
    release:

jobs:
    composer-validate:
        name: Validate composer.json
        runs-on: ubuntu-latest

        steps:
            - name: 'Checkout code'
              uses: actions/checkout@v7

            - name: 'Install PHP'
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  php-version: 8.5
                  tools: composer:v2
                  ini-values: date.timezone=UTC

            - name: Validate composer.json file
              run: composer validate --strict

    stable-tests:
        name: "${{ matrix.operating-system }} / PHP ${{ matrix.php-version }}"
        runs-on: ${{ matrix.operating-system }}

        strategy:
            fail-fast: false
            matrix:
                # add here only the PHP versions and OS used in GitHub CI (for tests)
                # and on the symfony.com server (where the Symfony Docs are built)
                operating-system: ['ubuntu-latest']
                php-version: ['8.4', '8.5']

        steps:
            - name: 'Checkout code'
              uses: actions/checkout@v7

            - name: 'Install PHP'
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  php-version: ${{ matrix.php-version }}
                  tools: composer:v2
                  ini-values: date.timezone=UTC

            - name: Install Composer Dependencies
              run: composer install --no-progress

            - name: PHPUnit
              run: composer test

    static-analysis:
        name: Static analysis
        runs-on: ubuntu-latest

        steps:
            - name: 'Checkout code'
              uses: actions/checkout@v7

            - name: 'Install PHP'
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  php-version: 8.5
                  tools: composer:v2
                  ini-values: date.timezone=UTC

            - name: Install
              run: |
                  composer update --no-scripts --working-dir=tools/psalm
                  composer install --no-progress

            - name: Check code style
              run: ./tools/psalm/vendor/bin/psalm

    code-style:
        name: Code style
        runs-on: ubuntu-latest

        steps:
            - name: 'Checkout code'
              uses: actions/checkout@v7

            - name: 'Install PHP'
              uses: shivammathur/setup-php@v2
              with:
                  coverage: none
                  php-version: 8.5
                  tools: composer:v2
                  ini-values: date.timezone=UTC

            - name: Install
              run: composer update --no-scripts --working-dir=tools/php-cs-fixer

            - name: Check code style
              run: ./tools/php-cs-fixer/vendor/bin/php-cs-fixer check --diff
